<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Practice</title>
<style>
  :root{
    --bg:#0f3460;
    --panel:#16213e;
    --text:#ffffff;
    --muted:rgba(255,255,255,.72);
    --note:#f1c40f;
    --note-border:#f39c12;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    min-height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0f3460;
    color:#fff;
    overscroll-behavior:none;
    touch-action:none;
  }

  body{
    user-select:none;
    -webkit-user-select:none;
    position:fixed;
    inset:0;
  }

  .screen{
    width:100%;
    height:100%;
    min-height:100dvh;
    display:flex;
  }

  #startScreen,#endScreen{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    background:linear-gradient(180deg,#16213e,#0f3460);
    text-align:center;
    padding:
      calc(24px + var(--safe-top))
      24px
      calc(24px + var(--safe-bottom));
  }

  #gameScreen{
    display:none;
    position:relative;
    background:#0f3460;
    width:100vw;
    height:100dvh;
    overflow:hidden;
  }

  h1{
    font-size:clamp(38px,11vw,52px);
    margin:0;
    letter-spacing:2px;
  }

  h2{
    font-size:clamp(30px,9vw,38px);
    margin:0;
  }

  p{
    font-size:clamp(15px,4.3vw,18px);
    color:var(--muted);
    margin:4px 0;
    max-width:560px;
  }

  button{
    touch-action:manipulation !important;
    pointer-events:auto !important;
    position:relative;
    z-index:20;
    border:0;
    border-radius:12px;
    padding:16px 28px;
    min-height:52px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    background:#f1c40f;
    color:#111;
    touch-action:manipulation;
  }

  button:active{transform:scale(.98)}

  #hud{
    position:absolute;
    top:calc(10px + var(--safe-top));
    left:50%;
    transform:translateX(-50%);
    z-index:6;
    display:flex;
    gap:18px;
    align-items:center;
    justify-content:center;
    width:max-content;
    max-width:calc(100vw - 16px);
    background:rgba(0,0,0,.28);
    padding:9px 14px;
    border-radius:12px;
    font-size:clamp(13px,3.8vw,20px);
    font-weight:700;
    backdrop-filter:blur(4px);
    white-space:nowrap;
  }

  #canvasWrap{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }

  #noteButtons{
    position:absolute;
    left:0;
    right:0;
    bottom:calc(10px + var(--safe-bottom));
    height:84px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    align-items:center;
    justify-items:center;
    padding:0 max(8px,2vw);
    gap:4px;
    z-index:8;
    touch-action:none;
  }

  .note-button{
    width:min(15.5vw,72px);
    height:min(15.5vw,72px);
    min-width:52px;
    min-height:52px;
    max-width:72px;
    max-height:72px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(22px,6vw,28px);
    font-weight:900;
    color:white;
    background:rgba(255,255,255,.10);
    border:3px solid rgba(255,255,255,.6);
    box-shadow:0 0 0 0 rgba(255,255,255,0);
    transition:transform .05s, background .08s, box-shadow .08s;
    touch-action:none;
  }

  .note-button.pressed{
    transform:scale(.92);
    background:rgba(255,255,255,.24);
  }

  .note-button.hit{
    box-shadow:0 0 22px 7px rgba(241,196,15,.8);
    background:rgba(241,196,15,.25);
  }

  .note-button.miss{
    box-shadow:0 0 22px 7px rgba(231,76,60,.85);
    background:rgba(231,76,60,.28);
  }

  #endStats{
    font-size:clamp(15px,4vw,19px);
    color:var(--muted);
    max-width:90vw;
  }

  .small{
    font-size:13px;
    opacity:.7;
  }

  @media (max-width:480px){
    #hud{
      gap:10px;
      padding:8px 10px;
    }

    #noteButtons{
      height:78px;
    }

    #canvasWrap{
      inset:0;
    }

    .note-button{
      min-width:50px;
      min-height:50px;
    }
  }

  @media (orientation:landscape) and (max-height:600px){
    #hud{
      top:calc(4px + var(--safe-top));
      font-size:14px;
      padding:6px 10px;
    }

    #noteButtons{
      bottom:calc(4px + var(--safe-bottom));
      height:64px;
    }

    .note-button{
      width:54px;
      height:54px;
      min-width:54px;
      min-height:54px;
      font-size:22px;
    }

    #canvasWrap{
      inset:0;
    }
  }
</style>
</head>
<body>
<div id="startScreen" class="screen">
  <h1>GUITAR</h1>
  <p>Press keys <b>1 2 3 4 5</b> when notes reach the circles.</p>
  <p>90 seconds • 225 notes • Kovaze-style timing window</p>
  <button id="startButton">Click to Start</button>
  <p class="small">Standalone practice clone — nothing is submitted anywhere.</p>
</div>

<div id="gameScreen" class="screen">
  <div id="hud">
    <span id="scoreText">Score: 0</span>
    <span id="streakDisplay">Streak: 0</span>
    <span id="timerText">Time: 1:30</span>
  </div>
  <div id="canvasWrap"><canvas id="gameCanvas"></canvas></div>
  <div id="noteButtons">
    <div class="note-button" data-lane="0">1</div>
    <div class="note-button" data-lane="1">2</div>
    <div class="note-button" data-lane="2">3</div>
    <div class="note-button" data-lane="3">4</div>
    <div class="note-button" data-lane="4">5</div>
  </div>
</div>

<div id="endScreen" class="screen" style="display:none">
  <h2>Finished!</h2>
  <div id="finalScore" style="font-size:34px;font-weight:800">Final Score: 0</div>
  <div id="endStats"></div>
  <button id="restartButton">Play Again</button>
</div>

<script>
const TOTAL_NOTES_PER_GAME = 225;
const NOTE_SPEED = 250;
const NOTE_RADIUS = 20;
const LANES = 5;
const LANE_PRESS_DEBOUNCE_MS = 50;
const GAME_DURATION = 90;
const HIT_TOLERANCE = 50; // Original Kovaze source: note center may be ±50px from the key center

const gameState = {
  score:0, streak:0, maxStreak:0, timeLeft:90, isPlaying:false,
  notes:[], notesHit:0, notesMissed:0, totalNotes:225, wrongPresses:0,
  lanePositions:[], lastLanePressTime:[0,0,0,0,0],
  startTime:0, animationId:null, timers:[]
};

const startScreen = document.getElementById('startScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const buttons = [...document.querySelectorAll('.note-button')];

function getStreakMultiplier(streak){
  if(streak >= 20) return 5;
  if(streak >= 15) return 4;
  if(streak >= 10) return 3;
  if(streak >= 5) return 2;
  return 1;
}

function resize(){
  const wrap = document.getElementById('canvasWrap');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(wrap.clientWidth*dpr);
  canvas.height = Math.floor(wrap.clientHeight*dpr);
  canvas.style.width = wrap.clientWidth+'px';
  canvas.style.height = wrap.clientHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const width = wrap.clientWidth;
  gameState.lanePositions = buttons.map(btn=>{
    const r = btn.getBoundingClientRect();
    return {x:r.left+r.width/2, y:r.top+r.height/2};
  });
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => {
  setTimeout(resize, 150);
});

function updateDisplay(){
  document.getElementById('scoreText').textContent = `Score: ${gameState.score}`;
  const mult = getStreakMultiplier(gameState.streak);
  document.getElementById('streakDisplay').textContent =
    mult > 1 ? `Streak: ${gameState.streak} (x${mult})` : `Streak: ${gameState.streak}`;
  const m = Math.floor(gameState.timeLeft/60);
  const s = gameState.timeLeft%60;
  document.getElementById('timerText').textContent = `Time: ${m}:${String(s).padStart(2,'0')}`;
}

function generateNoteSchedule(){
  const schedule=[];
  for(let i=0;i<TOTAL_NOTES_PER_GAME;i++){
    schedule.push({
      time:Math.random()*85,
      lane:Math.floor(Math.random()*LANES)
    });
  }
  schedule.sort((a,b)=>a.time-b.time);
  schedule.forEach(spawn=>{
    const id=setTimeout(()=>{
      if(gameState.isPlaying) spawnNote(spawn.lane);
    },spawn.time*1000);
    gameState.timers.push(id);
  });
}

function spawnNote(lane){
  gameState.notes.push({
    lane,
    y:-NOTE_RADIUS*2,
    hit:false,
    missed:false
  });
}

function handleLanePress(lane){
  if(!gameState.isPlaying) return;
  const now=Date.now();
  if(now-gameState.lastLanePressTime[lane] < LANE_PRESS_DEBOUNCE_MS) return;
  gameState.lastLanePressTime[lane]=now;

  const button=buttons[lane];
  button.classList.add('pressed');
  setTimeout(()=>button.classList.remove('pressed'),100);

  const hitZoneY=gameState.lanePositions[lane].y;
  let notesHitCount=0;
  const remaining=[];

  for(const note of gameState.notes){
    if(note.lane===lane && !note.hit && !note.missed && Math.abs(note.y-hitZoneY)<HIT_TOLERANCE){
      note.hit=true;
      const basePoints=10;
      const multiplier=getStreakMultiplier(gameState.streak);
      gameState.score += basePoints*multiplier;
      gameState.notesHit++;
      notesHitCount++;
    } else {
      remaining.push(note);
    }
  }
  gameState.notes=remaining;

  if(notesHitCount>0){
    gameState.streak += notesHitCount;
    gameState.maxStreak=Math.max(gameState.maxStreak,gameState.streak);
    button.classList.add('hit');
    setTimeout(()=>button.classList.remove('hit'),300);
  } else {
    gameState.streak=0;
    gameState.wrongPresses++;
    button.classList.add('miss');
    setTimeout(()=>button.classList.remove('miss'),300);
  }
  updateDisplay();
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4','5'].includes(e.key)){
    e.preventDefault();
    handleLanePress(Number(e.key)-1);
  }
});
buttons.forEach((b,i)=>b.addEventListener('mousedown',()=>handleLanePress(i)));

const noteButtonsContainer = document.getElementById('noteButtons');

noteButtonsContainer.addEventListener('touchstart', e => {
  e.preventDefault();
  const pressed = new Set();
  for (const touch of e.changedTouches) {
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const button = el && el.closest ? el.closest('.note-button') : null;
    if (button) {
      const lane = Number(button.dataset.lane);
      if (!pressed.has(lane)) {
        pressed.add(lane);
        handleLanePress(lane);
      }
    }
  }
}, { passive:false });

noteButtonsContainer.addEventListener('touchmove', e => {
  e.preventDefault();
}, { passive:false });

document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });

let lastFrame=0;
function gameLoop(ts){
  if(!gameState.isPlaying) return;
  const dt=Math.min((ts-lastFrame)/1000 || 0,0.05);
  lastFrame=ts;

  const elapsed=(Date.now()-gameState.startTime)/1000;
  const newTime=Math.max(0,Math.ceil(GAME_DURATION-elapsed));
  if(newTime!==gameState.timeLeft){
    gameState.timeLeft=newTime;
    updateDisplay();
  }
  if(elapsed>=GAME_DURATION){
    endGame();
    return;
  }

  const h=canvas.clientHeight;
  for(const note of gameState.notes){
    note.y += NOTE_SPEED*dt;
    const hitZoneY=gameState.lanePositions[note.lane].y;
    if(!note.hit && !note.missed && note.y>hitZoneY+50){
      note.missed=true;
      gameState.notesMissed++;
      gameState.streak=0;
      updateDisplay();
    }
  }
  gameState.notes=gameState.notes.filter(n=>n.y<h+NOTE_RADIUS*2);

  draw();
  gameState.animationId=requestAnimationFrame(gameLoop);
}

function draw(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#0f3460';
  ctx.fillRect(0,0,w,h);

  // lanes
  for(const pos of gameState.lanePositions){
    ctx.fillStyle='rgba(255,255,255,.20)';
    ctx.fillRect(pos.x-1,0,2,h);
  }

  // hit zones (same visible radius as source: 40)
  for(const pos of gameState.lanePositions){
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,40,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.10)';
    ctx.fill();
  }

  // notes
  for(const note of gameState.notes){
    const x=gameState.lanePositions[note.lane].x;
    ctx.beginPath();
    ctx.arc(x,note.y,NOTE_RADIUS,0,Math.PI*2);
    ctx.fillStyle='#f1c40f';
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle='#f39c12';
    ctx.stroke();
  }
}

function resetState(){
  gameState.score=0;
  gameState.streak=0;
  gameState.maxStreak=0;
  gameState.timeLeft=90;
  gameState.notes=[];
  gameState.notesHit=0;
  gameState.notesMissed=0;
  gameState.totalNotes=TOTAL_NOTES_PER_GAME;
  gameState.wrongPresses=0;
  gameState.lastLanePressTime=[0,0,0,0,0];
  gameState.timers.forEach(clearTimeout);
  gameState.timers=[];
}

function startGame(){
  resetState();
  startScreen.style.display='none';
  endScreen.style.display='none';
  gameScreen.style.display='flex';
  gameState.isPlaying=true;
  requestAnimationFrame(()=>{
    resize();
    gameState.startTime=Date.now();
    lastFrame=performance.now();
    generateNoteSchedule();
    updateDisplay();
    gameState.animationId=requestAnimationFrame(gameLoop);
  });
}

function endGame(){
  if(!gameState.isPlaying) return;
  gameState.isPlaying=false;
  if(gameState.animationId) cancelAnimationFrame(gameState.animationId);
  gameState.timers.forEach(clearTimeout);
  gameState.timers=[];
  gameScreen.style.display='none';
  endScreen.style.display='flex';
  document.getElementById('finalScore').textContent=`Final Score: ${gameState.score}`;
  document.getElementById('endStats').textContent =
    `Notes hit: ${gameState.notesHit} / ${gameState.totalNotes} | Max Streak: ${gameState.maxStreak} | Wrong presses: ${gameState.wrongPresses}`;
}

function bindMobileButton(el, fn) {
  let fired = false;
  const run = (e) => {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    if (fired) return;
    fired = true;
    fn();
    setTimeout(() => { fired = false; }, 400);
  };

  el.addEventListener('click', run, { passive:false });
  el.addEventListener('touchend', run, { passive:false });
  el.addEventListener('pointerup', run, { passive:false });
}

bindMobileButton(document.getElementById('startButton'), startGame);
bindMobileButton(document.getElementById('restartButton'), startGame);
</script>
</body>
</html>
